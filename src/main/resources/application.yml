spring:
  application:
    name: trimly

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trimly}
    username: ${DB_USER:trimly}
    password: ${DB_PASSWORD:trimly}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts on purpose: the cache is an optimisation, and a slow
      # Redis must not become slower than the database it is meant to spare.
      timeout: 200ms
      connect-timeout: 200ms

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    io.github.david7777k.trimly: DEBUG

trimly:
  cache:
    # How long a resolved link stays cached. Links rarely change, so this is
    # generous; a delete evicts the entry immediately anyway.
    ttl: PT1H
    # Much shorter for "no such code". A wrong guess should not be remembered
    # for an hour, and the entry exists only to absorb floods of junk lookups.
    missing-ttl: PT1M

  clicks:
    # Bounded. When it fills, events are dropped rather than made to wait -
    # analytics are worth less than the redirect they describe.
    queue-capacity: 10000
    batch-size: 500
    flush-interval: PT1S
